<svg viewBox="0 0 1180 1000" width="1180" height="1000" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="shadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
    <radialGradient id="bgGrad" cx="30%" cy="0%" r="90%">
      <stop offset="0%" stop-color="#141b2d"/>
      <stop offset="100%" stop-color="#0a0e18"/>
    </radialGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="25%" stop-color="#8b5cf6"/>
      <stop offset="50%" stop-color="#22d3ee"/>
      <stop offset="75%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#f472b6"/>
    </linearGradient>
    <style>
      .bg { fill: url(#bgGrad); }
      .frame { fill: none; stroke: #1f2937; stroke-width: 2; }
      .title { fill: #f1f5f9; font-size: 22px; font-weight: 700; }
      .subtitle { fill: #94a3b8; font-size: 12px; }
      .boundary { fill: none; stroke-dasharray: 5 5; stroke-width: 1.5; opacity: .6; }
      .domlabel { font-size: 10.5px; font-weight: 700; letter-spacing: 1.4px; }
      .node { fill: #101827; stroke-width: 2; rx: 10; }
      .nodeText { fill: #f1f5f9; font-size: 12px; font-weight: 700; }
      .nodeSub { fill: #97a3b8; font-size: 9.4px; }
      .flow { fill: none; stroke-width: 1.75; opacity: .6; stroke-dasharray: 6 6; animation: dash 1.1s linear infinite; }
      .flowTrunk { fill: none; stroke-width: 2.25; opacity: .85; stroke-dasharray: 7 7; animation: dash 1.3s linear infinite; }
      .flowPower { fill: none; stroke-width: 2.5; opacity: .9; stroke-dasharray: 8 5; animation: dash 1s linear infinite; }
      @keyframes dash { to { stroke-dashoffset: -26; } }
      .legendText { fill: #cbd5e1; font-size: 11px; }
      .footer { fill: #64748b; font-size: 9.5px; }
      .railLabel { font-size: 9.5px; font-weight: 700; }
      .badge { fill: #1a1508; stroke: #fbbf24; stroke-width: 1.2; opacity: .9; }
      .badgeText { fill: #fbbf24; font-size: 8.5px; font-weight: 700; }
      @media (prefers-reduced-motion: reduce) {
        .flow, .flowTrunk, .flowPower { animation: none; }
        .pulse { display: none; }
      }
    </style>
  </defs>

  <rect class="bg" width="1180" height="1000" rx="22"/>
  <rect class="frame" x="1" y="1" width="1178" height="998" rx="22"/>
  <rect x="30" y="58" width="1120" height="3" rx="1.5" fill="url(#accent)" opacity="0.8"/>

  <text class="title" x="590" y="32" text-anchor="middle">ANUFS APPPD - System Architecture</text>
  <text class="subtitle" x="590" y="49" text-anchor="middle">STM32F0 pedal/throttle sensing and ignition &amp; ETB kill-switch interface</text>

  <!-- Legend -->
  <g transform="translate(30,76)">
    <circle cx="0" cy="0" r="5" fill="#f59e0b"/><text class="legendText" x="11" y="4">Power</text>
    <circle cx="80" cy="0" r="5" fill="#8b5cf6"/><text class="legendText" x="91" y="4">Compute</text>
    <circle cx="175" cy="0" r="5" fill="#22d3ee"/><text class="legendText" x="186" y="4">Sensing</text>
    <circle cx="280" cy="0" r="5" fill="#60a5fa"/><text class="legendText" x="291" y="4">Debug &amp; USB</text>
    <circle cx="400" cy="0" r="5" fill="#34d399"/><text class="legendText" x="411" y="4">Comms / CAN</text>
    <circle cx="510" cy="0" r="5" fill="#f472b6"/><text class="legendText" x="521" y="4">Shutdown / Status</text>
  </g>

  <!-- ============ POWER BAND (single +3.3V rail - the +5V node never leaves this band) ============ -->
  <rect class="boundary" x="15" y="90" width="1150" height="220" rx="18" stroke="#f59e0b"/>
  <text class="domlabel" x="32" y="108" fill="#f59e0b">POWER</text>

  <g filter="url(#shadow)">
    <rect class="node" x="25" y="115" width="545" height="50" stroke="#f59e0b"/>
    <rect class="node" x="590" y="115" width="545" height="50" stroke="#f59e0b"/>
    <rect class="node" x="25" y="180" width="1110" height="55" stroke="#f59e0b"/>
    <rect class="node" x="375" y="250" width="410" height="50" stroke="#f59e0b"/>
  </g>
  <text class="nodeText" x="297.5" y="136" text-anchor="middle">Battery Feed</text>
  <text class="nodeSub" x="297.5" y="152" text-anchor="middle">via shared harness connector &#8226; +12V in</text>

  <text class="nodeText" x="862.5" y="136" text-anchor="middle">USB-C Input</text>
  <text class="nodeSub" x="862.5" y="152" text-anchor="middle">ESD-protected &#8226; VBUS diode-ORed in</text>

  <text class="nodeText" x="580" y="203" text-anchor="middle">Protection + Buck Converter</text>
  <text class="nodeSub" x="580" y="218" text-anchor="middle">ideal-diode PFET (zener-biased) &#183; buck &#8594; 5V, diode-ORed with USB VBUS</text>
  <text class="nodeSub" x="580" y="230" text-anchor="middle">&#8594; fused 5V node (not distributed - feeds the LDO only)</text>

  <text class="nodeText" x="580" y="273" text-anchor="middle">LDO Regulator</text>
  <text class="nodeSub" x="580" y="289" text-anchor="middle"><tspan fill="#fbbf24" font-weight="700">+3.3V rail</tspan> &#8226; only rail that leaves this band</text>

  <path class="flowPower" stroke="#f59e0b" d="M297.5 165 L297.5 180"/>
  <path class="flowPower" stroke="#f59e0b" d="M862.5 165 L862.5 180"/>
  <path class="flowPower" stroke="#f59e0b" d="M580 235 L580 250"/>

  <path id="RAIL33" class="flowPower" stroke="#fbbf24" d="M580 300 L580 350"/>
  <text class="railLabel" x="595" y="325" fill="#fbbf24">+3.3V</text>
  <circle class="pulse" r="3.2" fill="#fbbf24"><animateMotion dur="2.4s" repeatCount="indefinite"><mpath href="#RAIL33"/></animateMotion></circle>

  <!-- ============ ROW 2: SENSING (left) - COMPUTE (center) - COMMS (right) ============ -->
  <rect class="boundary" x="20" y="320" width="300" height="270" rx="16" stroke="#22d3ee"/>
  <text class="domlabel" x="34" y="340" fill="#22d3ee">PEDAL &amp; THROTTLE SENSING</text>
  <rect class="badge" x="220" y="346" width="62" height="18" rx="6"/>
  <text class="badgeText" x="251" y="359" text-anchor="middle">+3.3V</text>

  <g filter="url(#shadow)">
    <rect class="node" x="40" y="370" width="260" height="45" stroke="#22d3ee"/>
    <rect class="node" x="40" y="425" width="125" height="70" stroke="#22d3ee"/>
    <rect class="node" x="175" y="425" width="125" height="70" stroke="#22d3ee"/>
    <rect class="node" x="40" y="505" width="260" height="55" stroke="#22d3ee"/>
  </g>
  <text class="nodeText" x="170" y="393" text-anchor="middle" font-size="11">APPPD Connector</text>
  <text class="nodeSub" x="170" y="408" text-anchor="middle">pins 5-8 &#8226; raw sensor lines</text>

  <text class="nodeText" x="102.5" y="453" text-anchor="middle" font-size="10.5">Pedal Position</text>
  <text class="nodeSub" x="102.5" y="467" text-anchor="middle">APPS1/APPS2</text>
  <text class="nodeSub" x="102.5" y="479" text-anchor="middle">TVS-protected</text>

  <text class="nodeText" x="237.5" y="453" text-anchor="middle" font-size="10.5">Throttle Position</text>
  <text class="nodeSub" x="237.5" y="467" text-anchor="middle">TPS1/TPS2</text>
  <text class="nodeSub" x="237.5" y="479" text-anchor="middle">TVS-protected</text>

  <text class="nodeText" x="170" y="528" text-anchor="middle">Signal Buffers</text>
  <text class="nodeSub" x="170" y="544" text-anchor="middle">TLV9062 &#215;2 &#8226; unity-gain &#8594; MCU ADC</text>

  <path class="flow" stroke="#22d3ee" d="M102.5 415 L102.5 425"/>
  <path class="flow" stroke="#22d3ee" d="M237.5 415 L237.5 425"/>
  <path class="flow" stroke="#22d3ee" d="M102.5 495 L102.5 505"/>
  <path class="flow" stroke="#22d3ee" d="M237.5 495 L237.5 505"/>

  <rect class="boundary" x="340" y="320" width="440" height="290" rx="16" stroke="#8b5cf6"/>
  <text class="domlabel" x="356" y="340" fill="#8b5cf6">COMPUTE</text>

  <g filter="url(#glow)">
    <rect class="node" x="360" y="350" width="400" height="195" stroke="#8b5cf6" stroke-width="2.5" fill="#1a1330"/>
  </g>
  <text class="nodeText" x="560" y="410" text-anchor="middle" font-size="15">STM32F072CBTx</text>
  <text class="nodeSub" x="560" y="430" text-anchor="middle">Arm Cortex-M0 &#8226; main MCU</text>
  <text class="nodeSub" x="560" y="446" text-anchor="middle">ADC &#183; I2C &#183; CAN &#183; USB &#183; GPIO</text>

  <g filter="url(#shadow)">
    <rect class="node" x="360" y="560" width="400" height="35" stroke="#8b5cf6"/>
  </g>
  <text class="nodeText" x="560" y="583" text-anchor="middle" font-size="11.5">24 MHz Crystal</text>
  <path class="flow" stroke="#8b5cf6" d="M560 545 L560 560"/>

  <rect class="boundary" x="820" y="320" width="340" height="180" rx="16" stroke="#34d399"/>
  <text class="domlabel" x="836" y="340" fill="#34d399">COMMS</text>
  <rect class="badge" x="1078" y="346" width="62" height="18" rx="6"/>
  <text class="badgeText" x="1109" y="359" text-anchor="middle">+3.3V</text>

  <g filter="url(#shadow)">
    <rect class="node" x="840" y="370" width="300" height="55" stroke="#34d399"/>
    <rect class="node" x="840" y="433" width="300" height="40" stroke="#34d399"/>
  </g>
  <text class="nodeText" x="990" y="393" text-anchor="middle">CAN Transceiver</text>
  <text class="nodeSub" x="990" y="409" text-anchor="middle">TCAN337</text>
  <text class="nodeText" x="990" y="457" text-anchor="middle" font-size="10.5">CAN Connector</text>

  <path class="flow" stroke="#34d399" d="M990 425 L990 433"/>

  <!-- direct adjacent hub connections, row 2 -->
  <path id="H1" class="flowTrunk" stroke="#22d3ee" d="M300 532.5 L360 532.5"/>
  <path id="H2" class="flowTrunk" stroke="#34d399" d="M760 397.5 L840 397.5"/>
  <circle class="pulse" r="3" fill="#22d3ee"><animateMotion dur="2.2s" repeatCount="indefinite"><mpath href="#H1"/></animateMotion></circle>
  <circle class="pulse" r="3" fill="#34d399"><animateMotion dur="2s" repeatCount="indefinite"><mpath href="#H2"/></animateMotion></circle>

  <!-- MCU <-> Shutdown control, routed through the clear gap right of COMPUTE (two parallel lanes, never touching a block) -->
  <path id="H3" class="flowTrunk" stroke="#f472b6" d="M760 480 L795 480 L795 725 L845 725"/>
  <path id="H4" class="flowTrunk" stroke="#f472b6" d="M760 510 L810 510 L810 892.5 L845 892.5"/>
  <circle class="pulse" r="3" fill="#f472b6"><animateMotion dur="2.5s" repeatCount="indefinite"><mpath href="#H3"/></animateMotion></circle>
  <circle class="pulse" r="3" fill="#f472b6"><animateMotion dur="2.8s" repeatCount="indefinite"><mpath href="#H4"/></animateMotion></circle>

  <!-- ============ ROW 3: DEBUG & USB (under COMPUTE) + SHUTDOWN CONTROL (under COMMS / channel) ============ -->
  <rect class="boundary" x="350" y="620" width="420" height="190" rx="16" stroke="#60a5fa"/>
  <text class="domlabel" x="366" y="640" fill="#60a5fa">DEBUG &amp; USB</text>

  <g filter="url(#shadow)">
    <rect class="node" x="380" y="660" width="170" height="120" stroke="#60a5fa"/>
    <rect class="node" x="570" y="660" width="170" height="120" stroke="#60a5fa"/>
  </g>
  <text class="nodeText" x="465" y="705" text-anchor="middle" font-size="11">Debug /</text>
  <text class="nodeText" x="465" y="719" text-anchor="middle" font-size="11">Programming</text>
  <text class="nodeSub" x="465" y="740" text-anchor="middle">SWD</text>

  <text class="nodeText" x="655" y="712" text-anchor="middle" font-size="11">USB-C Port</text>
  <text class="nodeSub" x="655" y="733" text-anchor="middle">ESD-protected</text>
  <text class="nodeSub" x="655" y="746" text-anchor="middle">D+/D- to MCU</text>

  <path id="H5" class="flowTrunk" stroke="#60a5fa" d="M465 545 L465 660"/>
  <path id="H6" class="flowTrunk" stroke="#60a5fa" d="M655 545 L655 660"/>
  <circle class="pulse" r="3" fill="#60a5fa"><animateMotion dur="2.3s" repeatCount="indefinite"><mpath href="#H5"/></animateMotion></circle>
  <circle class="pulse" r="3" fill="#60a5fa"><animateMotion dur="2.6s" repeatCount="indefinite"><mpath href="#H6"/></animateMotion></circle>

  <rect class="boundary" x="820" y="640" width="340" height="300" rx="16" stroke="#f472b6"/>
  <text class="domlabel" x="836" y="660" fill="#f472b6">SHUTDOWN CONTROL</text>
  <rect class="badge" x="1078" y="646" width="62" height="18" rx="6" stroke="#f59e0b"/>
  <text class="badgeText" x="1109" y="659" text-anchor="middle" fill="#f59e0b">+12V</text>

  <g filter="url(#shadow)">
    <rect class="node" x="845" y="680" width="290" height="90" stroke="#f472b6"/>
    <rect class="node" x="845" y="790" width="290" height="55" stroke="#f472b6"/>
    <rect class="node" x="845" y="865" width="290" height="55" stroke="#f472b6"/>
  </g>
  <text class="nodeText" x="990" y="705" text-anchor="middle">Kill-Switch Control</text>
  <text class="nodeSub" x="990" y="721" text-anchor="middle">MCU-driven low-side switches</text>
  <text class="nodeSub" x="990" y="734" text-anchor="middle">pulls ignition/ETB lines to GND</text>
  <text class="nodeSub" x="990" y="747" text-anchor="middle">inline LED indicators on each line</text>

  <text class="nodeText" x="990" y="813" text-anchor="middle" font-size="11">APPPD Connector</text>
  <text class="nodeSub" x="990" y="828" text-anchor="middle">pins 1-2 &#8226; kill lines out</text>

  <text class="nodeText" x="990" y="888" text-anchor="middle">Board Status LED</text>
  <text class="nodeSub" x="990" y="903" text-anchor="middle">direct GPIO drive</text>

  <path class="flow" stroke="#f472b6" d="M990 770 L990 790"/>

  <text class="footer" x="30" y="975">Every domain sits directly beside the MCU or in a clear routing gap - no wire crosses another wire, a block, or the canvas edge. "+3.3V" badges mark rail-powered domains without redrawing the rail everywhere.</text>
  <text class="footer" x="1150" y="975" text-anchor="end">apppd.kicad_sch</text>
</svg>
